<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard | Ayush Sati</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.3);
            /* Increased transparency and added a slight white tint for the glass look */
            --glass-bg: rgba(255, 255, 255, 0.03); 
            --glass-panel: rgba(15, 23, 42, 0.65);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            /* Multi-layered border for glass depth */
            --border-glass: rgba(255, 255, 255, 0.12);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.15), transparent),
                        linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1750px;
        }

        /* Enhanced Glass Panel */
        .glass-panel {
            background: var(--glass-panel);
            /* Stronger blur effect for that deep frosted look */
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 30px;
            /* Inner glow and outer shadow for depth */
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.05),
                        0 25px 50px rgba(0, 0, 0, 0.4);
        }

        /* Sidebar Styling */
        .profile-sidebar {
            text-align: center;
            height: fit-content;
            position: sticky;
            top: 30px;
        }

        .owner-dp {
            width: 100px; height: 120px;
            margin: 0 auto 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, var(--primary-green), transparent);
            overflow: hidden;
            box-shadow: 0 0 30px var(--green-glow);
        }

        .owner-dp img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            border-radius: 50%;
        }

        .owner-name { font-size: 1.5rem; font-weight: 700; color: var(--primary-green); margin: 0; text-shadow: 0 0 10px var(--green-glow); }
        .owner-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 4px; display: block; margin-top: 10px; }

        .company-meta {
            text-align: left;
            margin-top: 35px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }

        .meta-item label {
            display: block;
            font-size: 0.6rem;
            color: var(--primary-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .meta-item p { margin: 0 0 18px 0; font-size: 0.85rem; color: var(--text-main); opacity: 0.9; }

        /* Forecast Form Glass Effect */
        .forecast-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.02);
        }

        .forecast-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 20px;
            color: white;
            flex: 1;
            min-width: 150px;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 15px var(--green-glow);
        }

        button {
            background: var(--primary-green);
            color: #000;
            border: none;
            padding: 0 45px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition);
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--green-glow);
        }

        .result-pill {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--primary-green);
            border-radius: 12px;
            color: var(--primary-green);
            font-weight: 700;
            backdrop-filter: blur(5px);
        }

        /* Analytics Grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            padding: 25px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .chart-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .full-width { grid-column: span 2; }
        .chart-wrapper { flex-grow: 1; position: relative; margin-top: 20px; }

        h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0;
            letter-spacing: 2.5px;
            opacity: 0.8;
        }

        @media (max-width: 1100px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .analytics-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        <!-- Profile Sidebar -->
        <aside class="glass-panel profile-sidebar">
            <div class="owner-dp">
                <img src="{{ url_for('static', filename='ayush_image.jpeg') }}">
            </div>
            <h1 class="owner-name">Ayush Sati</h1>
            <span class="owner-title">Executive Owner</span>
            
            <div class="company-meta">
                <div class="meta-item">
                    <label>Corporate ID</label>
                    <p>#AS-EMERALD-2026</p>
                </div>
                <div class="meta-item">
                    <label>Support Contact</label>
                    <p>0444-055-0444</p>
                </div>
                <div class="meta-item">
                    <label>System Node</label>
                    <p>Ambala Cantt, IN</p>
                </div>
            </div>
        </aside>

        <!-- Main Dashboard -->
        <main class="glass-panel">
            <h2 style="margin: 0 0 25px 0; font-size: 2rem; color: var(--primary-green); font-weight: 800; letter-spacing: -0.5px;">Sales Intelligence <span style="font-weight: 300; color: white; opacity: 0.6;">Dashboard</span></h2>
            
            <div class="forecast-section">
                <form class="forecast-form" method="POST" action="/predict">
                    <input type="number" name="quantity" placeholder="Quantity" required>
                    <input type="number" name="discount" placeholder="Discount %" required>
                    <input type="number" name="month" placeholder="Month (1-12)" min="1" max="12" required>
                    <button type="submit">Execute Prediction</button>
                </form>
                {% if prediction %}
                <div class="result-pill">✅ Forecast Result: ₹ {{ prediction }}</div>
                {% endif %}
            </div>

            <div class="analytics-grid">
                <div class="chart-card full-width">
                    <h3>📊 Average Monthly Trend</h3>
                    <div class="chart-wrapper"><canvas id="lineChart"></canvas></div>
                </div>

                <div class="chart-card">
                    <h3>📁 Category Revenue</h3>
                    <div class="chart-wrapper"><canvas id="catChart"></canvas></div>
                </div>

                <div class="chart-card">
                    <h3>🌍 Regional Growth</h3>
                    <div class="chart-wrapper"><canvas id="regChart"></canvas></div>
                </div>

                <div class="chart-card full-width">
                    <h3>📉 Discount vs Profit Ratio</h3>
                    <div class="chart-wrapper"><canvas id="scatterChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Customizing Chart Colors for Glass look
        Chart.defaults.color = 'rgba(255, 255, 255, 0.6)';
        Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

        const baseOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, border: { display: false } },
                x: { grid: { display: false }, border: { display: false } }
            }
        };

        const labels = JSON.parse('{{ labels | safe }}');
        const values = JSON.parse('{{ values | safe }}');

        // Main Trend
        const lineCtx = document.getElementById('lineChart').getContext('2d');
        const grad = lineCtx.createLinearGradient(0, 0, 0, 400);
        grad.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
        grad.addColorStop(1, 'rgba(16, 185, 129, 0)');

        new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ 
                    data: values, 
                    borderColor: '#10b981', 
                    borderWidth: 4, 
                    tension: 0.4, 
                    fill: true, 
                    backgroundColor: grad,
                    pointRadius: 5,
                    pointBackgroundColor: '#10b981',
                    pointBorderColor: 'rgba(255,255,255,0.2)',
                    pointBorderWidth: 2
                }]
            },
            options: baseOptions
        });

        // Category
        new Chart(document.getElementById('catChart'), {
            type: 'bar',
            data: {
                labels: JSON.parse('{{ cat_labels | safe }}'),
                datasets: [{ data: JSON.parse('{{ cat_values | safe }}'), backgroundColor: 'rgba(16, 185, 129, 0.7)', borderRadius: 10 }]
            },
            options: baseOptions
        });

        // Region
        new Chart(document.getElementById('regChart'), {
            type: 'bar',
            data: {
                labels: JSON.parse('{{ reg_labels | safe }}'),
                datasets: [{ data: JSON.parse('{{ reg_values | safe }}'), backgroundColor: 'rgba(52, 211, 153, 0.7)', borderRadius: 10 }]
            },
            options: baseOptions
        });

        // Scatter
        const sData = JSON.parse('{{ scatter_data | safe }}');
        new Chart(document.getElementById('scatterChart'), {
            type: 'scatter',
            data: {
                datasets: [{ 
                    data: sData.map(d => ({ x: d.Discount, y: d.Profit })), 
                    backgroundColor: '#10b981',
                    pointRadius: 6,
                    pointHoverRadius: 8
                }]
            },
            options: baseOptions
        });
    </script>
</body>
</html>
